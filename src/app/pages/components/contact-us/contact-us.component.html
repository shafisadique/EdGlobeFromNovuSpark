

<!-- Contact Section -->
<section class="contact-section">
  <div class="contact-wrapper">
    <!-- Left Side: Form -->
    <div class="contact-form">
      <h2><span style="color: #44A1A3; font-family: 'Alegreya', serif;">Send Us a Message</span></h2>
      <form #contactForm="ngForm" (ngSubmit)="handleSubmit(contactForm)" novalidate>
        <div class="form-grid">
          <input type="text" name="name" ngModel placeholder="Your Name" required />
          <input type="email" name="email" ngModel placeholder="Email Address" required />
          <input type="tel" name="phone" ngModel placeholder="Phone Number" />
          <input type="text" name="organization" ngModel placeholder="Organization / School" />
        </div>
        <textarea name="message" ngModel placeholder="Write your message here..." rows="5" required></textarea>
        <button type="submit" class="btn-submit" [disabled]="!contactForm.valid">Send Message</button>
      </form>
    </div>

   <!-- Right Side: Info -->
<div class="contact-info">
  <h2><span style="color: #44A1A3; font-family: 'Alegreya', serif;">Contact Information</span></h2>
  <p>Have questions? We’re just one message away.</p>
  <ul>
    <li><i class="fas fa-map-marker-alt"></i> London / Toronto / Kolkata</li>
    <li><i class="fas fa-envelope"></i> sadique.shafi&#64;novuspark.com</li>
    <li><i class="fas fa-envelope"></i> info&#64;novuspark.com</li>
    <li><i class="fas fa-globe"></i> <a href="https://www.novuspark.com" target="_blank" style="color: #44A1A3;">www.novuspark.com</a></li>
    <li><i class="fas fa-phone"></i> +91 8210167414</li>
    <li><i class="fas fa-phone"></i> +44 7354907949</li>
  </ul>

  <div class="social-links">
    <a href="https://facebook.com/novuspark" target="_blank"><i class="fab fa-facebook-f"></i></a>
    <a href="https://linkedin.com/company/novuspark" target="_blank"><i class="fab fa-linkedin-in"></i></a>
    <a href="https://twitter.com/novuspark" target="_blank"><i class="fab fa-twitter"></i></a>
  </div>

  <!-- Embedded Map -->
  <div class="map">
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3683.366858732!2d88.427529!3d22.567465!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a0275d5e9632a8d%3A0x6c7e0d7c9d7c9d7c!2sKolkata%2C%20West%20Bengal!5e0!3m2!1sen!2sin!4v1700000000000!5m2!1sen!2sin" 
      width="100%" 
      height="300" 
      style="border:0;" 
      allowfullscreen="" 
      loading="lazy" 
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>
</div>


  </div>
</section>
