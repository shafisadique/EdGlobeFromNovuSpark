<!-- Banner Section -->
<section class="contact-banner">
  <div class="banner-content">
    <h1>Let’s Connect</h1>
    <p>We’d love to hear from you! Reach out to us for queries, demos, or partnerships.</p>
  </div>
</section>

<!-- Contact Section -->
<section class="contact-section">
  <div class="contact-wrapper">
    <!-- Left Side: Form -->
    <div class="contact-form">
      <h2><span style="color: #44A1A3; font-family: 'Alegreya', serif;">Send Us a Message</span></h2>
      <form #contactForm="ngForm" (ngSubmit)="handleSubmit(contactForm)" novalidate>
        <div class="form-grid">
          <input type="text" name="name" ngModel placeholder="Your Name" required />
          <input type="email" name="email" ngModel placeholder="Email Address" required />
          <input type="tel" name="phone" ngModel placeholder="Phone Number" />
          <input type="text" name="organization" ngModel placeholder="Organization / School" />
        </div>
        <textarea name="message" ngModel placeholder="Write your message here..." rows="5" required></textarea>
        <button type="submit" class="btn-submit" [disabled]="!contactForm.valid">Send Message</button>
      </form>
    </div>

    <!-- Right Side: Info -->
    <div class="contact-info">
      <h2><span style="color: #44A1A3; font-family: 'Alegreya', serif;">Contact Information</span></h2>
      <p>Have questions? We’re just one message away.</p>
      <ul>
         <li><i class="fas fa-map-marker-alt"></i> India</li>
        <li><i class="fas fa-envelope"></i> info&#64;
          novuspark.com</li>
        <li><i class="fas fa-envelope"></i>  shafisadique123&#64;gmail.com</li>
        <li><i class="fas fa-phone"></i> +91 8210167414</li>
      </ul>

      <div class="social-links">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
      </div>

      <!-- Embedded Map -->
      <div class="map">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!..." 
          width="100%" 
          height="200" 
          style="border:0;" 
          allowfullscreen="" 
          loading="lazy">
        </iframe>
      </div>
    </div>
  </div>
</section>
