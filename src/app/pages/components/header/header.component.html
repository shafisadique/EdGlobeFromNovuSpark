<header class="desktop-header" [class.scrolled]="isScrolled">
  <a class="logo">
    <img src="assets/ED-logo.png" alt="EdGlobe">
  </a>

  <nav class="nav-links">
    <a (click)="scroll('home')" [class.active]="activeSection==='home'">Home</a>
    <a (click)="scroll('features')" [class.active]="activeSection==='features'">Features</a>
    <a (click)="scroll('about')" [class.active]="activeSection==='about'">About</a>
    <a (click)="scroll('contact')" [class.active]="activeSection==='contact'">Contact</a>
  </nav>
</header>
<nav class="neo-bottom-nav">
  <div class="nav-item" (click)="scroll('home')" [class.active]="activeSection === 'home'">
    <i class="fas fa-home"></i>
    <span>Home</span>
  </div>

  <div class="nav-item" (click)="scroll('about')" [class.active]="activeSection === 'about'">
    <i class="fas fa-info-circle"></i> <!-- Better icon for About -->
    <span>About Us</span>
  </div>

  <!-- Center Floating Logo -->
  <div class="center-slot"></div>
  <div class="center-float">
    <img src="assets/ED-Globe.png" alt="EdGlobe">
  </div>

  <div class="nav-item" (click)="scroll('features')" [class.active]="activeSection === 'features'">
    <i class="fas fa-th-large"></i> <!-- Good icon for Features -->
    <span>Features</span>
  </div>

  <div class="nav-item" (click)="scroll('contact')" [class.active]="activeSection === 'contact'">
    <i class="fas fa-phone-alt"></i>
    <span>Contact</span>
  </div>
</nav>
